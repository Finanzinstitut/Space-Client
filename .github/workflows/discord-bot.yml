# .github/workflows/discord-bot.yml
# Wird automatisch vom Cloudflare Worker in jedem Ziel-Repo erstellt/aktualisiert.
# Repo-Secrets: PUSH_TOKEN (Contents + Actions + Workflows: Read & write), DISCORD_WEBHOOK
name: Discord Bot

on:
  repository_dispatch:
    types: [discord-upload]

permissions:
  contents: write
  actions: read

concurrency: discord-upload

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: ZIP laden, entpacken, Repo-Inhalt ersetzen
        env:
          ZIP_URL: ${{ github.event.client_payload.url }}
        run: |
          set -e
          curl -fsSL "$ZIP_URL" -o /tmp/upload.zip
          mkdir -p /tmp/src
          unzip -q /tmp/upload.zip -d /tmp/src
          rm -rf /tmp/src/__MACOSX /tmp/src/.git
          SRC=/tmp/src
          if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then
            SRC="$SRC/$(ls -A "$SRC")"
          fi
          # .github NIE aus der ZIP übernehmen - schützt discord-bot.yml vor Überschreiben
          rm -rf "$SRC/.git" "$SRC/.github"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC/." .
          [ -f gradlew ] && chmod +x gradlew || true

      - name: Commit & Push
        id: commit
        env:
          MSG: ${{ github.event.client_payload.message }}
        run: |
          git config user.name "Space Upload Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "result=nochange" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$MSG"
            git push
            echo "result=pushed" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord – Push-Status
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          RESULT: ${{ steps.commit.outputs.result }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" != "success" ]; then
            TEXT="❌ Upload fehlgeschlagen – $RUN_URL"
          elif [ "$RESULT" = "nochange" ]; then
            TEXT="ℹ️ Keine Änderungen in der ZIP – nichts committet."
          else
            TEXT="⬆️ Commit \`${SHA:0:7}\` gepusht – suche nach Build …"
          fi
          jq -n --arg c "$TEXT" '{content: $c}' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Auf Build warten und Ergebnis melden
        if: steps.commit.outputs.result == 'pushed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 6
            RESP=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20")
            RUN_ID=$(echo "$RESP" | jq -r '.workflow_runs[] | select(.path != ".github/workflows/discord-bot.yml") | .id' | head -n1)
            [ -n "$RUN_ID" ] && break
          done

          if [ -z "$RUN_ID" ]; then
            jq -n '{content: "ℹ️ Kein eigener Build-Workflow für diesen Commit gefunden."}' \
              | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
            exit 0
          fi

          STATUS="in_progress"
          for i in $(seq 1 60); do
            sleep 10
            RESP=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")
            STATUS=$(echo "$RESP" | jq -r '.status')
            [ "$STATUS" = "completed" ] && break
          done

          CONCLUSION=$(echo "$RESP" | jq -r '.conclusion')
          RUN_HTML_URL=$(echo "$RESP" | jq -r '.html_url')
          NAME=$(echo "$RESP" | jq -r '.name')

          case "$CONCLUSION" in
            success)   HEAD="✅ **Build erfolgreich**" ;;
            cancelled) HEAD="⚪ Build abgebrochen" ;;
            "")        HEAD="⏱️ Build noch nicht fertig (Zeitlimit erreicht)" ;;
            *)         HEAD="❌ **Build fehlgeschlagen**" ;;
          esac

          TEXT="$HEAD – $NAME"$'\n'"$RUN_HTML_URL"
          jq -n --arg c "$TEXT" '{content: $c}' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
