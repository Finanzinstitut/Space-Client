name: Build Space Client for Android

# Only when the Android side changes, or on request.
#
# Kept separate from build.yml on purpose: the desktop build takes a Rust
# toolchain and several minutes on two platforms, and rebuilding it because a
# Kotlin file moved would waste that every time. The two never need to run
# together - a phone build does not produce a Windows exe and should not try.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the APK
        working-directory: android
        # Debug rather than release: a release build wants a signing key, and
        # an unsigned release APK will not install at all. Debug installs and
        # runs, which is what a build meant for finding out whether this works
        # needs to do.
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name it after the run
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/space-client-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: space-client-android
          path: android/out/*.apk
          if-no-files-found: error
