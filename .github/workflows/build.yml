name: Build Space Client

on:
  push:
    branches: [main]
    # A tag is what publishes. tauri-action attaches the bundles it has just
    # built, so the installer people download is the one this run produced -
    # not one somebody extracted from an artifact afterwards.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The tag carries the dot this repository has always written after the
      # v, and the title does not. Both spellings are what the launcher's
      # update check already reads, so neither is being changed here.
      - name: Read launcher version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          # Loudly, because the quiet version of this has already cost a run:
          # an empty value made the tag come out as "v.", a ref cannot end in a
          # dot, and the refusal that came back named permissions rather than
          # the name. A build that cannot say what it is should stop here.
          if [ -z "$version" ]; then
            echo "No version found in src-tauri/Cargo.toml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Space Client
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary at compile time. Never in the tree: this
          # repository is public, and a key committed to public source is a key
          # that gets revoked. An empty secret builds a launcher whose
          # CurseForge source asks the user for their own key instead.
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          # Empty unless this run is meant to publish, which leaves
          # tauri-action building only. Both platforms name the same release,
          # so the second one to finish adds its bundles to what the first one
          # created rather than opening a second release.
          #
          # Two ways in, because a tag cannot always be pushed from outside: a
          # token scoped to one branch is refused on refs/tags. tauri-action
          # creates the tag through the release API instead, and the token
          # inside a run is allowed to.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && format('v.{0}', steps.version.outputs.value) || '' }}
          releaseName: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && format('Release v{0}', steps.version.outputs.value) || '' }}
          # The commit this run built, not the repository's default branch.
          # Without it the new tag lands wherever main happens to be, so
          # checking out the tag gives source that never produced this
          # installer - which is the one thing a tag is for.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: space-client-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
