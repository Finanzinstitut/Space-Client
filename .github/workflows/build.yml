name: Build Space Client

on:
  push:
    branches: [main]
    # A tag is what publishes. tauri-action attaches the bundles it has just
    # built, so the installer people download is the one this run produced -
    # not one somebody extracted from an artifact afterwards.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The tag carries the dot this repository has always written after the
      # v, and the title does not. Both spellings are what the launcher's
      # update check already reads, so neither is being changed here.
      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build Space Client
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          # Empty unless this run is meant to publish, which leaves
          # tauri-action building only. Both platforms name the same release,
          # so the second one to finish adds its bundles to what the first one
          # created rather than opening a second release.
          #
          # Two ways in, because a tag cannot always be pushed from outside: a
          # token scoped to one branch is refused on refs/tags. tauri-action
          # creates the tag through the release API instead, and the token
          # inside a run is allowed to.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && format('v.{0}', steps.version.outputs.value) || '' }}
          releaseName: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && format('Release v{0}', steps.version.outputs.value) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: space-client-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
