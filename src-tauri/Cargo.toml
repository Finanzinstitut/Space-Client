[package]
name = "space-client"
version = "0.5.0"
description = "Space Client - Minecraft Java Launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "5"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "0.6"
anyhow = "1"

[[bin]]
name = "space-client"
path = "src/main.rs"
