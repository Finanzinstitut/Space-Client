<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Space Client</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="planet-glow"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-orb"></div>
        <span>SPACE CLIENT</span>
      </div>
      <nav>
        <button class="nav-item active" data-view="instances">🚀 <span data-i18n="nav_instances"></span></button>
        <button class="nav-item" data-view="mods">🛰️ <span data-i18n="nav_mods"></span></button>
        <button class="nav-item" data-view="skin">🧍 <span data-i18n="nav_skin"></span></button>
        <button class="nav-item" data-view="account">👤 <span data-i18n="nav_account"></span></button>
        <button class="nav-item" data-view="settings">⚙️ <span data-i18n="nav_settings"></span></button>
      </nav>
      <div class="account-chip" id="account-chip">
        <span class="dot" id="account-dot"></span>
        <span id="account-name" data-i18n="not_signed_in"></span>
      </div>
      <div class="sidebar-footer" id="version-label">v0.1.0</div>
    </aside>

    <main class="content">
      <!-- INSTANCES -->
      <section id="view-instances" class="view active">
        <div class="head-row">
          <div>
            <h1 data-i18n="instances_title"></h1>
            <p class="subtitle" data-i18n="instances_sub"></p>
          </div>
          <div class="head-actions">
            <button id="btn-import-modpack" class="btn secondary" data-i18n="btn_import"></button>
            <button id="btn-new-instance" class="btn primary" data-i18n="btn_new_instance"></button>
          </div>
        </div>

        <div id="drop-zone" class="drop-zone">
          <span>📦</span>
          <span data-i18n="import_hint"></span>
        </div>
        <div id="instance-list" class="instance-list"></div>
        <div id="global-status" class="status-line"></div>
        <div id="progress-wrap" class="progress-wrap hidden">
          <div class="progress-label" id="progress-label"></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
      </section>

      <!-- MODS -->
      <section id="view-mods" class="view">
        <h1 data-i18n="mods_title"></h1>
        <p class="subtitle" data-i18n="mods_sub"></p>

        <div class="card wide">
          <div class="field grow">
            <label data-i18n="mods_pick_instance"></label>
            <select id="mods-instance"></select>
          </div>

          <div id="mods-warning" class="warning-box hidden"></div>

          <div id="mods-panel">
            <div class="tab-row">
              <button class="tab active" data-tab="browse" data-i18n="mods_browse"></button>
              <button class="tab" data-tab="installed" data-i18n="mods_installed"></button>
            </div>

            <div id="tab-browse" class="tab-panel active">
              <div class="type-row" id="type-row">
                <button class="type-btn active" data-type="mod" data-i18n="type_mod"></button>
                <button class="type-btn" data-type="resourcepack" data-i18n="type_resourcepack"></button>
                <button class="type-btn" data-type="shader" data-i18n="type_shader"></button>
              </div>

              <p class="hint" id="type-note"></p>

              <div class="row">
                <input id="mods-query" type="text" data-i18n-ph="mods_search_ph" class="grow" />
                <button id="btn-mods-search" class="btn primary small" data-i18n="btn_search"></button>
              </div>

              <div class="cat-label" data-i18n="categories_label"></div>
              <div id="category-chips" class="chip-row"></div>

              <div id="mods-results" class="mod-list"></div>
            </div>

            <div id="tab-installed" class="tab-panel">
              <div class="row">
                <button id="btn-check-mod-updates" class="btn secondary small" data-i18n="btn_check_updates"></button>
                <button id="btn-update-all-mods" class="btn primary small hidden" data-i18n="btn_update_all"></button>
                <button id="btn-repair-mods" class="btn secondary small" data-i18n="btn_repair"></button>
              </div>
              <p class="hint" data-i18n="repair_hint"></p>
              <div id="mods-installed-list" class="mod-list"></div>
            </div>
          </div>

          <div id="mods-status" class="status-line"></div>
        </div>
      </section>

      <!-- SKIN -->
      <section id="view-skin" class="view">
        <h1 data-i18n="skin_title"></h1>
        <p class="subtitle" data-i18n="skin_sub"></p>

        <div id="skin-warning" class="warning-box hidden"></div>

        <div id="skin-panel" class="skin-layout">
          <div class="card skin-preview-card">
            <label data-i18n="skin_current"></label>
            <div class="skin-preview">
              <canvas id="skin-canvas"></canvas>
            </div>
            <div id="skin-name" class="skin-name"></div>
          </div>

          <div class="card grow">
            <div id="skin-drop-zone" class="drop-zone skin-drop">
              <span>🧍</span>
              <span data-i18n="skin_drop"></span>
            </div>

            <div class="field grow">
              <label data-i18n="skin_model"></label>
              <div class="row">
                <button class="type-btn" id="model-classic" data-variant="classic" data-i18n="model_classic"></button>
                <button class="type-btn" id="model-slim" data-variant="slim" data-i18n="model_slim"></button>
              </div>
            </div>

            <div class="field grow">
              <label data-i18n="skin_capes"></label>
              <div id="cape-list" class="cape-list"></div>
            </div>

            <div id="skin-status" class="status-line"></div>
          </div>
        </div>
      </section>

      <!-- ACCOUNT -->
      <section id="view-account" class="view">
        <h1 data-i18n="account_title"></h1>
        <p class="subtitle" data-i18n="account_sub"></p>

        <div class="card">
          <div id="account-signed-out">
            <button id="btn-signin" class="btn primary" data-i18n="btn_signin"></button>
            <p class="hint" data-i18n="ms_blocked_note"></p>

            <div class="divider"><span data-i18n="or_divider"></span></div>

            <div class="offline-box">
              <strong data-i18n="offline_title"></strong>
              <p class="hint" data-i18n="offline_hint"></p>
              <div class="row">
                <input id="offline-username" type="text" data-i18n-ph="offline_username" class="grow" />
                <button id="btn-offline-login" class="btn secondary small" data-i18n="btn_offline_login"></button>
              </div>
            </div>
          </div>

          <div id="account-list" class="account-list"></div>

          <div id="account-signed-in" class="hidden">
            <div class="field">
              <label data-i18n="signed_in_as"></label>
              <div class="account-row">
                <img id="account-skin" alt="" width="48" height="48" />
                <strong id="account-username"></strong>
                <span id="account-badge" class="badge hidden" data-i18n="offline_badge"></span>
              </div>
            </div>
            <button id="btn-signout" class="btn secondary" data-i18n="btn_signout"></button>
          </div>

          <div id="login-flow" class="hidden login-flow">
            <p data-i18n="login_step1"></p>
            <div class="row">
              <code id="login-url" class="code-box"></code>
              <button id="btn-open-browser" class="btn secondary small" data-i18n="btn_open_browser"></button>
            </div>
            <p data-i18n="login_step2"></p>
            <div class="row">
              <code id="login-code" class="code-box big"></code>
              <button id="btn-copy-code" class="btn secondary small" data-i18n="btn_copy"></button>
            </div>
            <p class="waiting" data-i18n="login_waiting"></p>
          </div>

          <div id="account-status" class="status-line"></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view">
        <h1 data-i18n="settings_title"></h1>
        <div class="card">
          <div class="field grow">
            <label data-i18n="field_install_path"></label>
            <div class="row">
              <input id="install-path" type="text" readonly />
              <button id="btn-pick-path" class="btn secondary small" data-i18n="btn_choose"></button>
            </div>
            <p class="hint" data-i18n="install_path_hint"></p>
          </div>

          <div class="field grow">
            <label data-i18n="field_java"></label>
            <input id="java-path" type="text" data-i18n-ph="java_ph" />
            <p class="hint" data-i18n="java_hint"></p>
          </div>

          <div class="field grow">
            <label data-i18n="field_default_ram"></label>
            <input id="ram-slider" type="range" min="1024" max="16384" step="512" />
            <span id="ram-value"></span>
          </div>

          <div class="field grow">
            <label data-i18n="field_language"></label>
            <select id="language-select">
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </div>

          <div class="field grow">
            <label class="checkbox">
              <input type="checkbox" id="check-updates" />
              <span data-i18n="field_updates"></span>
            </label>
          </div>

          <div class="field grow">
            <label class="checkbox">
              <input type="checkbox" id="live-logs" />
              <span data-i18n="field_live_logs"></span>
            </label>
            <p class="hint" data-i18n="live_logs_hint"></p>
          </div>

          <div class="row actions">
            <button id="btn-save-settings" class="btn primary" data-i18n="btn_save"></button>
          </div>
          <div id="settings-status" class="status-line"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- CREATE INSTANCE MODAL -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 data-i18n="create_title"></h2>

      <div class="field grow">
        <label data-i18n="field_name"></label>
        <input id="new-name" type="text" data-i18n-ph="field_name_ph" />
      </div>

      <div class="field grow">
        <label data-i18n="field_version"></label>
        <select id="new-version"></select>
        <label class="checkbox">
          <input type="checkbox" id="new-snapshots" />
          <span data-i18n="field_snapshots"></span>
        </label>
      </div>

      <div class="field grow">
        <label data-i18n="field_loader"></label>
        <select id="new-loader">
          <option value="vanilla">Vanilla</option>
          <option value="fabric">Fabric</option>
          <option value="quilt">Quilt</option>
          <option value="forge">Forge</option>
          <option value="neoforge">NeoForge</option>
        </select>
      </div>

      <div id="hud-compat-note" class="compat-note hidden"></div>

      <div class="field grow" id="new-loader-version-field">
        <label data-i18n="field_loader_version"></label>
        <select id="new-loader-version"></select>
      </div>

      <div class="field grow">
        <label data-i18n="field_ram"></label>
        <input id="new-ram" type="range" min="1024" max="16384" step="512" />
        <span id="new-ram-value"></span>
      </div>

      <div class="field grow">
        <label data-i18n="field_location"></label>
        <div class="row">
          <input id="new-path" type="text" readonly />
          <button id="btn-pick-instance-path" class="btn secondary small" data-i18n="btn_choose"></button>
        </div>
        <p class="hint" data-i18n="location_hint"></p>
      </div>

      <div class="row actions">
        <button id="btn-cancel-create" class="btn secondary" data-i18n="btn_cancel"></button>
        <button id="btn-confirm-create" class="btn primary" data-i18n="btn_create"></button>
      </div>
      <div id="create-status" class="status-line"></div>
    </div>
  </div>

  <!-- EDIT INSTANCE MODAL -->
  <div id="edit-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 data-i18n="edit_title"></h2>

      <div class="field grow">
        <label data-i18n="field_name"></label>
        <input id="edit-name" type="text" />
      </div>

      <div class="field grow">
        <label data-i18n="field_version"></label>
        <input id="edit-mc" type="text" readonly />
        <p class="hint" data-i18n="field_fixed"></p>
      </div>

      <div class="field grow" id="edit-loader-version-field">
        <label data-i18n="field_loader_version"></label>
        <select id="edit-loader-version"></select>
        <p class="hint" data-i18n="edit_reinstall_note"></p>
      </div>

      <div class="field grow">
        <label data-i18n="field_ram"></label>
        <input id="edit-ram" type="range" min="1024" max="16384" step="512" />
        <span id="edit-ram-value"></span>
      </div>

      <div class="field grow" id="edit-clientmod-field">
        <label class="checkbox">
          <input type="checkbox" id="edit-client-mod" />
          <span data-i18n="field_client_mod"></span>
        </label>
        <p class="hint" data-i18n="client_mod_hint"></p>
      </div>

      <div class="row actions">
        <button id="btn-cancel-edit" class="btn secondary" data-i18n="btn_cancel"></button>
        <button id="btn-confirm-edit" class="btn primary" data-i18n="btn_save"></button>
      </div>
      <div id="edit-status" class="status-line"></div>
    </div>
  </div>

  <!-- VERSION PICKER -->
  <div id="version-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 data-i18n="versions_title"></h2>
      <div id="version-project" class="version-project"></div>
      <div id="version-list" class="version-list"></div>
      <div class="row actions">
        <button id="btn-close-versions" class="btn secondary" data-i18n="btn_cancel"></button>
      </div>
    </div>
  </div>

  <!-- LIVE CONSOLE -->
  <div id="console-backdrop" class="console-backdrop hidden">
    <div class="console-window">
      <div class="console-header">
        <div>
          <strong data-i18n="console_title"></strong>
          <span id="console-instance" class="console-instance"></span>
        </div>
        <div class="console-actions">
          <label class="checkbox small-check">
            <input type="checkbox" id="console-autoscroll" checked />
            <span data-i18n="console_autoscroll"></span>
          </label>
          <button id="btn-console-clear" class="btn secondary small" data-i18n="btn_clear"></button>
          <button id="btn-console-kill" class="btn danger small" data-i18n="btn_kill"></button>
          <button id="btn-console-close" class="btn secondary small" data-i18n="btn_close"></button>
        </div>
      </div>
      <div id="console-output" class="console-output"></div>
    </div>
  </div>

  <!-- UPDATE BANNER -->
  <div id="update-banner" class="update-banner hidden">
    <div>
      <strong data-i18n="update_available"></strong>
      <div id="update-text"></div>
    </div>
    <div class="row">
      <button id="btn-update-later" class="btn secondary small" data-i18n="btn_later"></button>
      <button id="btn-update-download" class="btn primary small" data-i18n="btn_download_update"></button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
